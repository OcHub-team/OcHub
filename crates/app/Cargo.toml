[package]
name = "ochub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "OcHub desktop UI (GPUI)"

[[bin]]
name = "ochub"
path = "src/main.rs"

[dependencies]
ochub-core = { workspace = true }
ochub-protocol.workspace = true
gpui = { workspace = true }
gpui_platform = { workspace = true }
zed-text = { workspace = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
regex.workspace = true
uuid.workspace = true
unicode-segmentation.workspace = true
similar.workspace = true
chrono.workspace = true
tempfile.workspace = true
fs2.workspace = true
glob.workspace = true
base64.workspace = true
sha2.workspace = true
zip.workspace = true

[build-dependencies]
toml.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "0.24.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.winresource]
OriginalFilename = "ochub.exe"
ProductName = "OcHub"
FileDescription = "Native desktop manager for AI coding tools"
LegalCopyright = "OcHub contributors"

[package.metadata.packager]
product-name = "OcHub"
identifier = "io.github.sleepstars.ochub"
category = "DeveloperTool"
icons = [
    "assets/app-icons/ochub.icns",
    "assets/app-icons/ochub.ico",
    "assets/app-icons/ochub-*.png",
]
resources = [
    { src = "assets", target = "assets" },
    { src = "../../LICENSE", target = "LICENSE" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
entitlements = "../../packaging/macos/entitlements.plist"
info-plist-path = "../../packaging/macos/Info.plist"

[package.metadata.packager.nsis]
installer-icon = "assets/app-icons/ochub.ico"
installer-mode = "currentUser"
languages = ["English", "SimpChinese", "Japanese"]

[package.metadata.packager.deb]
depends = [
    "libasound2",
    "libfontconfig1",
    "libglib2.0-0",
    "libvulkan1",
    "libwayland-client0",
    "libx11-xcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
]
