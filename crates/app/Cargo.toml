[package]
name = "ochub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "OcHub desktop UI (GPUI)"

[[bin]]
name = "ochub"
path = "src/main.rs"

[dependencies]
ochub-core = { workspace = true }
ochub-server = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
zed-text = { workspace = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
log.workspace = true
uuid.workspace = true
unicode-segmentation.workspace = true
chrono.workspace = true
tempfile.workspace = true
fs2.workspace = true

[build-dependencies]
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "NSApplication", "NSResponder", "NSRunningApplication"] }
