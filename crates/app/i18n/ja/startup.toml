# Japanese — startup notices.
#
# Checked against zh-Hans/startup.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `startup.instance.unknown` stands in for a PID that could not be read, so it
# is a noun that fits mid-sentence.

"startup.instance.activated" = "OcHub はすでに実行中です（PID {pid}）。既存のウィンドウの表示を要求しました。"
"startup.instance.activation_failed" = "OcHub はすでに実行中です（PID {pid}）。ただし既存のウィンドウの表示は要求できませんでした。"
"startup.instance.unknown" = "不明"
