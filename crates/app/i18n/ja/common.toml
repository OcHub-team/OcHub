# Japanese — shared component strings.
#
# Checked against zh-Hans/common.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `common.calendar.month.name_NN` is the `{month}` of
# `common.calendar.month.title`. Japanese numbers its months and does not pad
# them, so the header reads「2026年7月」.
#
# `common.pagination.jump.*` brackets the page input: the row reads
# prefix + [input] + suffix, so Japanese puts the noun first and the verb after
# the box —「ページ [3] へ移動」.

"common.calendar.clear.label" = "クリア"
"common.calendar.day.aria" = "{year}年{month}月{day}日"
"common.calendar.hour.label" = "時"
"common.calendar.minute.label" = "分"
