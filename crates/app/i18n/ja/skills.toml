# Japanese — the skills panel (installed skills, marketplace, repos).
#
# Checked against zh-Hans/skills.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `skills.card.installed_at` / `.updated_at` put the timestamp first, because
# Japanese states the time before the verb —「2024-05-01 10:00 にインストール」.
# `skills.status.error_separator` joins the individual failures inside
# `skills.status.updated_partial`, so it is the 読点 rather than a semicolon.

