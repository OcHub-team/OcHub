# Simplified Chinese — the skills panel (installed skills, marketplace, repos).
#
# The `skills.*` area belongs to `crates/app/src/skills_view.rs`. This file is
# part of the reference catalog: every other locale is checked against it at
# build time, so a missing key or a changed {placeholder} fails the build.
# Keys are sorted alphabetically.
#
# `skills.action.*` labels a button that appears on more than one card, so the
# installed card and the two discovery cards share one label per state.
# `skills.status.error_separator` joins the individual failures inside
# `skills.status.updated_partial`; it is punctuation, so each locale sets its
# own.

