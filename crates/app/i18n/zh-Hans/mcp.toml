# Simplified Chinese — the MCP servers panel (the reference catalog).
#
# The `mcp.*` area belongs to `crates/app/src/mcp_view.rs`: the server list, the
# add/edit form and the delete confirmation. Keys are sorted alphabetically;
# `.aria` keys are read by assistive technology only.
#
# `mcp.form.spec.help` embeds two literal JSON objects. The build-time
# placeholder check reads every `{…}` run as a placeholder name, so the two
# examples must stay byte-identical in every locale — translate the prose around
# them, never the JSON. The JSON *placeholder* of the spec input is likewise not
# prose and stays in the Rust source.

