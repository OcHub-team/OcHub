# Simplified Chinese — the usage dashboard (filters, trend, tables, pricing).
#
# The `usage.*` area belongs to `crates/app/src/usage_view.rs`. This file is
# part of the reference catalog: every other locale is checked against it at
# build time, so a missing key or a changed {placeholder} fails the build.
# Keys are sorted alphabetically.
#
# `usage.status.error_separator` joins the individual load failures into the
# one toast `apply_data` raises, so it carries whatever spacing the language
# wants around it.

