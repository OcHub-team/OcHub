# Simplified Chinese — the advanced tools page (crates/app/src/tools_view.rs).
#
# Reference catalog for this area: every other locale is checked against it at
# build time. Keys are `<area>.<group>.<element>`; sort them alphabetically.
#
# Several groups spell out one whole sentence per branch instead of gluing
# clauses together — `tools.sync.status.*` (enabled × auto-sync × error),
# `tools.version.detail*` (error × broken executable),
# `tools.install.summary.*` (conflict × confirmation) and the
# `*_saved{,_backup,_warnings,_backup_warnings}` families. Chinese can append
# a clause to a finished sentence; English and Japanese cannot, so each
# combination gets its own entry.

