# Simplified Chinese — native shell menus (macOS menu bar, Dock/taskbar menu).
#
# Reference catalog for this area: every other locale is checked against it at
# build time. Keys are `<area>.<group>.<element>`; sort them alphabetically.
#
# `menu.provider.taskbar.*` is one whole label per state rather than a status
# word substituted into a shared template: the parenthetical carries grammar,
# and a bare verb cannot be translated on its own.

