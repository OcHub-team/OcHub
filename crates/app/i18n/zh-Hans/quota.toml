# 简体中文 —— 额度行与额度明细弹窗（参考目录）。
#
# `quota.*` 属于 `crates/app/src/quota.rs`：服务商卡片（官方订阅额度）和中转站
# 卡片（转发站额度）共用同一份文案，一处改动两处生效。
#
# 百分比一律是「剩余」而不是「已用」，所以 `quota.value.*` 必须把方向写进文案
# 里——单看 `82%` 没人知道是剩八成还是用掉八成。
#
# `quota.entry*` 是一档额度在卡片单行里的拼法，`quota.separator` 把各档接起来；
# 括号和间隔属于文案，不同语言的标点宽度不一样，别搬到 Rust 里去拼。

