# Simplified Chinese — theme library and editor (the reference catalog).
#
# The `theme.*` area belongs to `crates/app/src/theme_view.rs`. Keys are
# `<area>.<group>.<element>`; sort them alphabetically.
#
# The colour-token group names ("表面", "文字与边框", …) are identities: they are
# matched against `descriptor.group` with `==`, so the literals stay in the Rust
# source and only their headings live here, under `theme.editor.tokens.*`.

