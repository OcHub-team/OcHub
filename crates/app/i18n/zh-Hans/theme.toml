# Simplified Chinese — theme library and editor (the reference catalog).
#
# The `theme.*` area covers `crates/app/src/theme.rs` (the theme model, its
# validation and its file errors) and `crates/app/src/theme_view.rs` (the page).
# Keys are `<area>.<group>.<element>`; sort them alphabetically.
#
# `theme.validate.variant.*` is the only fragment here: it names the palette a
# `theme.validate.*` sentence is about, and is substituted into `{variant}`.
# Keep it a bare adjective ("浅色" / "light" / "ライト") so every sentence that
# takes it still reads naturally.
#
# The colour-token group names ("表面", "文字与边框", …) are identities: they are
# matched against `descriptor.group` with `==`, so the literals stay in the Rust
# source and only their headings live here, under `theme.editor.tokens.*`.
#
# `theme.token.*` 是颜色令牌的显示名，键名直接取自 `ThemeTokenDescriptor::key`
# （主题文件里的字段名，故为小驼峰），编辑器会在渲染时解析。

