# Simplified Chinese — the per-app settings panel (the reference catalog).
#
# The `app_settings.*` area belongs to `crates/app/src/app_settings_view.rs`:
# the behaviour toggles and config-directory override shown behind the gear in
# an app's provider-list header. Keys are sorted alphabetically.
#
# The config-dir *placeholders* (`~/.claude`, `~/.codex`, …) are filesystem
# paths, not prose, and stay in the Rust source.

