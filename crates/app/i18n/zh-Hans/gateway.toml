# Simplified Chinese — the relay manager (the reference catalog).
#
# The `gateway.*` area belongs to `crates/app/src/gateway_view.rs`. This file is
# part of the reference catalog: every other locale is checked against it at
# build time, so a missing key or a changed {placeholder} fails the build.
# Keys are sorted alphabetically.
#
# Dialect names ("Anthropic Messages", "OpenAI Chat", "OpenAI Responses") are
# protocol identifiers, so they stay in the Rust source and are never
# translated. `gateway.delete_blocked.separator` joins app labels into a list
# and is punctuation, not prose.

