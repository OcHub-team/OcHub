# Simplified Chinese — the provider add/edit form (the reference catalog).
#
# The `provider_editor.*` area belongs to `crates/app/src/provider_editor.rs`.
# Only the chrome the editor itself writes lives here: the form *schema*
# (section titles, field labels, help text, field placeholders) comes from
# `ochub_core::provider_config` and is translated there, not in this file.
#
# `provider_editor.preview.file_join` and `provider_editor.balance.item_join`
# are list separators, so they carry their own spacing: Chinese and Japanese
# use the ideographic comma with no space, English needs the trailing one.

