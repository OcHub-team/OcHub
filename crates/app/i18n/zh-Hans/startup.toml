# Simplified Chinese — startup notices (the reference catalog).
#
# These strings go to the terminal of whoever launched a second copy, so they
# resolve against the persisted `language` setting before the process exits.

"startup.instance.activated" = "OcHub 已在运行（PID {pid}），已请求显示现有窗口。"
"startup.instance.activation_failed" = "OcHub 已在运行（PID {pid}），但无法请求显示现有窗口。"
"startup.instance.unknown" = "未知"
