# Simplified Chinese — the app shell (sidebar, provider list, modals).
#
# Reference catalog for this area: every other locale is checked against it at
# build time. Keys are `<area>.<group>.<element>`; sort them alphabetically.
#
# `shell.action.*` labels a button on a provider card or the hero; the matching
# `.aria` key spells the whole sentence out, because a screen reader cannot be
# handed a verb and a name to glue together.

