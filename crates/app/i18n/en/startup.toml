# English — startup notices.
#
# Checked against zh-Hans/startup.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `startup.instance.unknown` stands in for a PID that could not be read, and is
# substituted into the middle of a sentence — keep it lowercase.

"startup.instance.activated" = "OcHub is already running (PID {pid}); the existing window has been asked to come forward."
"startup.instance.activation_failed" = "OcHub is already running (PID {pid}), but the existing window could not be asked to come forward."
"startup.instance.unknown" = "unknown"
