# English — theme library and editor.
#
# Checked against zh-Hans/theme.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `theme.validate.variant.*` is the only fragment here: it names the palette a
# `theme.validate.*` sentence is about, and is substituted into `{variant}`.
# Keep it a bare lowercase adjective so every sentence that takes it still reads
# as a sentence.
#
# `theme.error.field_qualified` names the field an editor error came from —
# "Light · Sidebar opacity". It is a separator, not a sentence, so it reads the
# same in every locale; it lives here so a language that wants a different
# separator can change one string.
#
# `theme.token.*` holds the display name of one color token. The key is the
# token's own identifier from `ThemeTokenDescriptor::key` — the field name a
# theme file uses, hence camelCase — so label and token cannot drift apart.

