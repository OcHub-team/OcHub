# English — the model-provider manager.
#
# Checked against zh-Hans/gateway.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# 模型供应商 is "model provider" here, matching shell.toml. The local OcHub HTTP
# server stays "gateway": it is OcHub's own endpoint, not one of the upstream
# services. Dialect names stay in the Rust source because they are protocol
# identifiers.

