# English — the skills panel (installed skills, marketplace, repos).
#
# Checked against zh-Hans/skills.toml at build time: every key must be present
# and use the same {placeholders}. Keys are sorted alphabetically.
#
# `skills.card.app_toggle.busy` / `.enabled` decorate an app name on a chip, so
# they carry no words of their own and read the same in every locale.
# `skills.status.error_separator` joins the individual failures inside
# `skills.status.updated_partial`, so it carries the trailing space.

