# Gemini CLI, expressed as a declarative manifest.
#
# This reproduces the native `provider_config::GeminiConfig` codec and the
# Gemini branch of `write_gemini_live` 1:1 (schema, encode/decode, preview,
# validation, and the on-disk `.env` + `settings.json` writes). The built-in
# plugin keeps its native UI metadata / MCP / prompt / skills / proxy
# capabilities; only the provider codec and the live-config write route through
# this manifest.

manifest_version = 1

[app]
id = "gemini"
name = "Gemini CLI"
accent = "#4285f4"
sort_order = 30
mode = "switch"

[app.icon]
builtin = "gemini"

[app.config_dir]
default = "~/.gemini"

# --- files -----------------------------------------------------------------

# ~/.gemini/.env — KEY=VALUE env. Replace-written with 0700 dir / 0600 file.
# OAuth mode (auth_mode = oauth) clears the store so an empty file is written.
[[files]]
id = "env"
path = ".env"
format = "env"
store_key = "env"
write = "replace"
dir_mode = "0700"
file_mode = "0600"
clear_when = { field = "auth_mode", equals = "oauth" }

# ~/.gemini/settings.json — the CLI's own settings object (mcpServers, theme,
# security.auth.selectedType, …). Preserved verbatim (passthrough), shallow
# merged into whatever is on disk, and skipped entirely when absent.
[[files]]
id = "settings"
path = "settings.json"
format = "json"
store_key = "config"
write = "merge_shallow"
passthrough = true
absent_preserves = true

# --- sections / fields -----------------------------------------------------

[[sections]]
title = "鉴权"

[[sections.fields]]
id = "auth_mode"
label = "鉴权方式"
kind = "select"
help = "第三方 / PackyCode 选 API Key；Google 官方账号登录选 OAuth。OAuth 模式下 .env 必须为空。"
options = [
  { value = "api_key", label = "API Key（第三方 / PackyCode）", hint = "写入 .env 的 GEMINI_API_KEY + GOOGLE_GEMINI_BASE_URL" },
  { value = "oauth", label = "Google 官方 OAuth 登录", hint = ".env 留空，使用 oauth-personal 登录" },
]
decode = { rule = "value_if_store_empty", file = "env", if_empty = "oauth", otherwise = "api_key" }

[[sections]]
title = "端点"

[[sections.fields]]
id = "base_url"
label = "Base URL"
kind = "text"
placeholder = "https://generativelanguage.googleapis.com"
help = "写入 .env 的 GOOGLE_GEMINI_BASE_URL；留空将被忽略（切勿写空串，会触发 GATEWAY 鉴权失败）。"
visible_when = { field = "auth_mode", equals = "api_key" }
map = { file = "env", env_key = "GOOGLE_GEMINI_BASE_URL", omit_empty = true, trim = true }

[[sections.fields]]
id = "api_key"
label = "API Key"
kind = "secret"
placeholder = "AIza..."
help = "写入 .env 的 GEMINI_API_KEY。"
visible_when = { field = "auth_mode", equals = "api_key" }
map = { file = "env", env_key = "GEMINI_API_KEY", omit_empty = true, trim = true }

[[sections]]
title = "模型"

[[sections.fields]]
id = "model"
label = "模型"
kind = "text"
placeholder = "gemini-2.5-pro"
help = "写入 .env 的 GEMINI_MODEL；留空则不写该变量，由 CLI 使用默认模型。"
map = { file = "env", env_key = "GEMINI_MODEL", omit_empty = true, trim = true }

[[sections]]
title = "高级"
advanced = true

[[sections.fields]]
id = "extra_env"
label = "额外环境变量"
kind = "keyvalue"
key_placeholder = "GEMINI_API_VERSION"
value_placeholder = "v1beta"
help = "追加写入 .env 的其它变量（不含上面已有的 base URL / key / model）。settings.json 中的其它字段（mcpServers、theme 等）会原样保留。"
map = { file = "env", rule = "rest" }

# --- validation ------------------------------------------------------------

[[validate]]
rule = "warn_empty"
field = "api_key"
when = { field = "auth_mode", equals = "api_key" }
message = "API Key 模式尚未填写 GEMINI_API_KEY。"

[[validate]]
rule = "warn_whitespace_only"
field = "base_url"
when = { field = "auth_mode", equals = "api_key" }
message = "Base URL 仅含空白字符，将被忽略。"

[[validate]]
rule = "info_any_nonempty"
fields = ["api_key", "base_url"]
when = { field = "auth_mode", equals = "oauth" }
message = "OAuth 模式下 .env 将被清空（base URL / API Key 不会写入）。"

# --- hooks -----------------------------------------------------------------

[hooks]
live_validate = "gemini.strict_validate"
post_write = ["gemini.selected_type"]
