name: Docs

# Quality gate for the documentation site.
#
# Deployment is NOT handled here — Cloudflare Workers Builds clones the
# repo, runs `pnpm build` in docs/site, and deploys with `wrangler deploy`
# (see docs/site/wrangler.jsonc). It authenticates with a Cloudflare-managed
# build token, so no API token needs to live in this repo. This workflow
# only enforces the checks that deploy pipeline doesn't run — prose/MDX lint
# and typecheck — so a broken page fails review rather than shipping.
on:
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs/site

jobs:
  build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `getLastUpdated()` derives each page's date from git history, so
          # a shallow clone would stamp every page with the checkout commit.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint prose and MDX
        run: pnpm lint:docs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
