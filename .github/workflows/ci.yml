name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux build dependencies
        run: ./scripts/ci/install-linux-deps.sh

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ci-quality
          cache-bin: true
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

  platform-check:
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-26
            cache: macos-arm64
          - name: Windows (x64)
            os: windows-2025
            cache: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ci-${{ matrix.cache }}
          cache-bin: true
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  release-cache:
    name: Warm release cache (${{ matrix.name }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # `ochub-core` reads this through `option_env!`, so rustc records it as a
      # build input and sccache hashes it. Warming without it would leave core,
      # app and cli -- the three slowest crates -- missing in every release.
      OCHUB_UPDATER_PUBKEY: ${{ vars.OCHUB_UPDATER_PUBKEY }}
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_CLIENT_SIDE: "1"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-linux-deps.sh

      - name: Show toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      # Saves what the release job restores, so the key must not carry this
      # job's name -- see the matching step in release.yml.
      - name: Cache Cargo inputs and tools
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}
          add-job-id-key: false
          cache-bin: true
          cache-targets: false
          save-if: true

      # The native GHA backend writes one object per request and was throttled
      # heavily in a real cold build. Keep sccache local during compilation,
      # then let actions/cache archive the directory in one operation.
      - name: Restore sccache directory
        id: sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-release-v1-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            sccache-release-v1-${{ matrix.target }}-

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Warm optimized Rust artifacts
        run: cargo build --release --locked --target "${{ matrix.target }}" -p ochub-app -p ochcli

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Save sccache directory
        if: success() && steps.sccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-release-v1-${{ matrix.target }}-${{ github.sha }}
