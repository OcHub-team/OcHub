[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/convert",
    "crates/cli",
    "crates/protocol",
]

[workspace.package]
version = "0.5.12"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["OcHub contributors"]
repository = "https://github.com/OcHub-team/OcHub"
rust-version = "1.97.0"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
serde_norway = "0.9"
toml = "1.1"
toml_edit = "0.25"
json5 = "1.3"
json-five = "0.3.1"
indexmap = { version = "2", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime + http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "process", "io-util", "io-std", "signal", "net"] }
futures = "0.3"
bytes = "1.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query", "stream", "blocking", "socks"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
http = "1"

# Storage
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
regex = "1.10"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
unicode-segmentation = "1"
base64 = "0.22"
sha2 = "0.11"
minisign-verify = "0.2.5"
hmac = "0.13"
flate2 = "1"
zip = "8.6"
tempfile = "3"
fs2 = "0.4"
glob = "0.3"
once_cell = "1.21"
sys-locale = "0.3"
rquickjs = { version = "0.12", features = ["array-buffer", "classes"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1.33"
auto-launch = "0.6"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"

# Internal crates
ochub-core = { path = "crates/core" }
ochub-convert = { path = "crates/convert" }
ochub-protocol = { path = "crates/protocol" }
ochub-ui = { version = "0.4.0", git = "https://github.com/OcHub-team/ochub-ui.git", tag = "v0.4.0" }

# GPUI is pinned to a Zed commit instead of crates.io because the published
# crate lags the APIs used by OcHub.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

[profile.qa]
inherits = "release"
opt-level = 2
debug = 1
incremental = true

# Mirror Zed's own [patch.crates-io]: the `util` crate (pulled in through
# `ochub-ui`'s `zed-text`) needs Zed's async-process fork (`Child::adopt_raw_pid`).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
