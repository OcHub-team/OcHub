function icon(name,size=17){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`}
const $=id=>document.getElementById(id),escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const appNames={codex:'Codex',claude:'Claude Code',opencode:'OpenCode'};const appLetters={codex:'C',claude:'✳',opencode:'O'};
const routes=[{id:'team-code',app:'codex',name:'团队编码',mode:'gateway',model:'code-pro',upstreamModel:'atlas-code-v2',written:'配置已写入',clients:'客户端读取未确认',gateway:'OcHub 本机网关',channels:[['North API','优先级 0 · 权重 2'],['West API','优先级 1 · 权重 1']],rule:'code-* → atlas-code-v2',observed:'2 个候选上游',count:416,enabled:true},{id:'direct-writing',app:'claude',name:'日常写作',mode:'direct',model:'reasoning-plus',upstreamModel:'reasoning-plus',written:'配置已写入',clients:'客户端读取未确认',channels:[['Acme Direct','Messages · api.example.org']],rule:'模型名透传',observed:'直连 · 无网关记录',count:null,enabled:true},{id:'shared-dev',app:'opencode',name:'开发共享',mode:'gateway',model:'fast-code',upstreamModel:'flash-code',written:'已加入应用',clients:'在应用中选择连接',gateway:'OcHub 本机网关',channels:[['North API','优先级 0 · 权重 1']],rule:'fast-code → flash-code',observed:'1 个候选上游',count:228,enabled:true}];
const requests=[{id:'req_07ac1',time:'14:32:08',name:'North API',model:'atlas-code-v2',request:'code-pro',source:'网关',ms:1420,first:328,code:200,cost:'0.0061',tokens:'1,824 / 486'},{id:'req_07ac0',time:'14:31:52',name:'West API',model:'atlas-code-v2',request:'code-pro',source:'网关',ms:821,first:null,code:502,cost:null,tokens:'未记录'},{id:'req_07ab9',time:'14:30:16',name:'North API',model:'flash-code',request:'fast-code',source:'网关',ms:936,first:216,code:200,cost:'0.0018',tokens:'936 / 212'},{id:'session_82',time:'14:27:04',name:'日常写作',model:'reasoning-plus',request:'reasoning-plus',source:'会话导入',ms:null,first:null,code:null,cost:'0.0182',tokens:'5,416 / 798'},{id:'req_07ab7',time:'14:22:40',name:'North API',model:'atlas-code-v2',request:'code-pro',source:'网关',ms:2034,first:404,code:200,cost:'0.0084',tokens:'2,604 / 614'}];
const state={page:'overview',env:'local',range:'24h',theme:'light',density:'comfortable',selected:'team-code',app:'all',recordTab:'requests',extensionTab:'plugins',query:'',drawer:null,noticeFilter:'all',notices:[{id:'apply-local',title:'配置已写入',summary:'Codex · 团队编码；客户端读取尚未确认。',details:'配置写入完成。\n环境：本机 · MacBook Pro\n应用：Codex\n本次演示没有操作真实文件。\n客户端是否读取：未确认；新会话或重启后读取。',tone:'success',env:'local',time:'14:30',unread:false},{id:'apply-dev',title:'开发机的应用结果待核对',summary:'远端可能已完成操作。重连后核对，避免重复提交。',details:'环境：开发机 · Ubuntu\n应用：Codex\n请求：应用草稿 demo-draft-27，版本 4\n返回连接中断，不能据此认定写入失败。\n核对会查询或安全继续同一次提交，不上传新的输入。',tone:'warning',env:'dev',time:'14:21',unread:true,action:'reconcile'},{id:'price-missing',title:'部分用量尚未计价',summary:'2 条会话导入记录缺少匹配价格。',details:'这不影响已记录的 token 数。\n所选时间范围的费用可能偏低。\n费用始终是按照 OcHub 定价计算的估算，不是账单。',tone:'info',env:'local',time:'13:54',unread:true,action:'usage'}],toast:null,demoDraft:null};
const envLabels={local:'本机',dev:'开发机',offline:'工作站'};const navItems=[['overview','总览'],['connections','连接'],['routes','路由'],['records','记录与用量'],['extensions','扩展'],['settings','设置']];let toastTimer,returnFocus;
function appSymbol(app){return `<span class="app-symbol ${app}">${appLetters[app]}</span>`}
function rangeSelect(){return `<select class="select" id="time-range" aria-label="统计时间范围"><option value="24h" ${state.range==='24h'?'selected':''}>过去 24 小时</option><option value="7d" ${state.range==='7d'?'selected':''}>过去 7 天</option><option value="30d" ${state.range==='30d'?'selected':''}>过去 30 天</option></select>`}
function nav(page){state.page=page;state.query='';$('global-search').value='';closeDrawer(false);$('page-scroll').scrollTop=0;render()}
function renderNav(){$('navigation').innerHTML=navItems.map(([id,title])=>`<button class="nav-btn ${state.page===id?'active':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}>${icon(id)}<span>${title}</span></button>`).join('');$('pinned').innerHTML=Object.keys(appNames).map(app=>`<button class="nav-btn" data-app-nav="${app}">${appSymbol(app)}<span>${appNames[app]}</span></button>`).join('');$('navigation').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('pinned').querySelectorAll('[data-app-nav]').forEach(b=>b.onclick=()=>{state.app=b.dataset.appNav;nav('connections')});$('env-icon').innerHTML=icon(state.env==='local'?'monitor':'server',17);$('theme-toggle').innerHTML=icon(state.theme==='light'?'moon':'sun');$('notifications-button').innerHTML=icon('bell')+(state.notices.some(n=>n.unread)?'<span class="unread-dot"></span>':'')}
function pageHead(title,subtitle,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="head-actions">${actions}</div></div>`}
function filteredRoutes(){return routes.filter(r=>(state.app==='all'||r.app===state.app)&&(!state.query||`${r.name} ${appNames[r.app]} ${r.id} ${r.channels.flat().join(' ')}`.toLowerCase().includes(state.query.toLowerCase())))}
function pathHtml(route,small=false){let direct=route.mode==='direct';return `<div class="route-path"><div class="path-heading">${icon('routes',15)} ${appNames[route.app]} · 配置路径 <span class="tiny">不代表实际请求轨迹</span></div><div class="path-flow"><div class="path-node"><span class="eyebrow">目标应用</span><strong>${appNames[route.app]}</strong><span class="sub">${route.model}</span></div><span class="path-link"></span><div class="path-node ${direct?'':'gateway'}"><span class="eyebrow">${direct?'接入方式':'路由'}</span><strong>${direct?'直接连接':route.name}</strong><span class="sub">${direct?'不经过 OcHub 网关':(state.env==='local'?'本机':'开发机')+' · :15721'}</span></div><span class="path-link"></span><div class="upstreams">${route.channels.map(([name,rule])=>`<div class="upstream"><div><strong>${name}</strong><span>${direct?'目标接口':'候选上游接口'}</span></div><div class="weight">${rule}</div></div>`).join('')}</div></div><div class="path-foot"><span>${direct?'直连请求无法从网关观测；会话可单独导入。':'虚线表示配置关联。实际命中取决于模型、协议和可用候选。'}</span>${small?'':`<button class="text-btn" data-inspect-route="${route.id}">查看配置 ${icon('arrow',13)}</button>`}</div></div>`}
function routeRows(){const filtered=filteredRoutes();return filtered.length?filtered.map(r=>`<tr class="actionable ${state.selected===r.id?'selected':''}" data-select-route="${r.id}" tabindex="0" aria-label="查看 ${appNames[r.app]} 的${r.name}配置路径"><td><div class="name">${appSymbol(r.app)}<span>${appNames[r.app]}</span></div></td><td><strong style="font-weight:520">${r.name}</strong><span class="sub">${r.mode==='gateway'?'通过 OcHub 网关':'直接连接'}</span></td><td>${r.written}<span class="sub">${r.clients}</span></td><td><span class="ellipsis">${r.observed}</span></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">没有匹配的连接</div></td></tr>`}
function chartHtml(){const raw=state.range==='24h'?[8,5,4,3,4,8,24,40,34,58,74,53,42,63,49,37,52,76,82,68,47,31,49,37]:state.range==='7d'?[32,48,37,70,62,81,46]:[21,32,19,30,43,29,44,58,47,54,76,48,62,71,68];const labels=state.range==='24h'?['昨天 14:00','今天 02:00','今天 14:00']:state.range==='7d'?['10 月 7 日','10 月 10 日','10 月 13 日']:['9 月 14 日','9 月 29 日','10 月 13 日'];return `<div class="chart" role="img" aria-label="${state.range==='24h'?'24 小时':'所选时间范围'}记录量柱状图；设计数据"><!-- 柱高代表对应时间桶，非装饰曲线 -->${raw.map((v,i)=>`<div class="bar" style="--height:${v}%"><span class="bar-fill"></span><span class="bar-label">第 ${i+1} 桶 · ${v*7} 条</span></div>`).join('')}</div><div class="chart-axis"><span>${labels[0]}</span><span>${labels[1]}</span><span>${labels[2]}</span></div>`}
function metricValues(){return state.range==='24h'?['1,284','2.18','328']:state.range==='7d'?['8,916','15.42','346']:['34,627','61.38','362']}
function activityHtml(){return `<ul class="activity-list">${requests.slice(0,4).map(r=>`<li class="activity-row"><span class="time">${r.time.slice(0,5)}</span><div class="activity-main"><button class="row-link" data-request="${r.id}"><strong>${r.name} <span class="muted">·</span> ${r.model}</strong><div class="sub">${r.source}${r.ms?' · '+(r.ms/1000).toFixed(2)+' s':''}</div></button></div>${r.code?`<span class="status-code ${r.code>=400?'bad':''}">${r.code}</span>`:'<span class="source-label">导入</span>'}</li>`).join('')}</ul>`}
function overview(){const values=metricValues(),selected=routes.find(r=>r.id===state.selected)||routes[0];return pageHead('总览',`${envLabels[state.env]}的连接、配置路径与近期记录`,rangeSelect()+`<button class="button quiet" data-refresh>${icon('refresh',14)}刷新</button>`)+`<div class="status-line"><span><span class="dot good"></span>网关运行中 <span class="mono">:15721</span></span><span>${icon('clock',14)} 上次读取 14:32</span><span class="status-note">运行状态仅指网关监听服务</span></div><div class="callout">${icon('warning',15)}<p>近期网关记录中有 <strong>1 次请求失败</strong><span class="muted"> · West API 返回 502</span></p><button class="text-btn" data-failures>查看记录 ${icon('arrow',13)}</button></div><section class="section"><div class="section-heading"><h2>连接路径</h2><span class="meta">当前配置</span><div class="aside"><button class="text-btn" data-nav="routes">管理路由 ${icon('arrow',13)}</button></div></div><div class="panel"><div class="table-wrap"><table class="data-table route-table"><thead><tr><th>应用</th><th>连接</th><th>配置状态</th><th>可观测范围</th></tr></thead><tbody>${routeRows()}</tbody></table></div>${pathHtml(selected)}</div></section><div class="lower-grid"><section><div class="section-heading"><h2>已记录的用量</h2><div class="aside"><button class="text-btn" data-usage>查看用量 ${icon('arrow',13)}</button></div></div><div class="metric-strip"><div><span class="metric-label">记录数量</span><span class="metric-value">${values[0]}</span></div><div><span class="metric-label">估算费用 · USD</span><span class="metric-value">$${values[1]}</span></div><div><span class="metric-label">网关平均首 token</span><span class="metric-value">${values[2]}<small>ms</small></span></div></div>${chartHtml()}<p class="scope-note">网关请求 + 已导入会话，按现有规则去重。未经过网关且未导入的活动不在统计内。</p></section><section><div class="section-heading"><h2>最近记录</h2><div class="aside"><button class="text-btn" data-nav="records">全部记录 ${icon('arrow',13)}</button></div></div>${activityHtml()}<div class="scope-note">选中记录查看已观测的上游、模型与响应；没有完整逐跳追踪。</div></section></div><div class="footer-note"><span>配置状 function connections(){const filtered=filteredRoutes();return pageHead('连接','按应用管理来源；保存草稿与写入配置是两个动作',`<button class="button primary" data-new-connection>${icon('plus',14)}添加连接</button>`)+`<div class="tabs"><button class="tab ${state.app==='all'?'active':''}" data-app="all">全部应用</button>${Object.keys(appNames).map(app=>`<button class="tab ${state.app===app?'active':''}" data-app="${app}">${appNames[app]}</button>`).join('')}<span class="aside tiny muted">${filtered.length} 条连接</span></div><div class="panel"><table class="data-table route-table"><thead><tr><th>应用</th><th>连接与接入方式</th><th>配置状态</th><th></th></tr></thead><tbody>${filtered.map(r=>`<tr><td><div class="name">${appSymbol(r.app)}${appNames[r.app]}</div></td><td><strong style="font-weight:520">${r.name}</strong><span class="sub">${r.mode==='gateway'?'网关 · '+r.channels.length+' 个候选上游':'直接连接'}</span></td><td>${r.written}<span class="sub">${r.clients}</span></td><td class="right"><button class="button quiet" data-inspect-route="${r.id}">查看 ${icon('chevron',13)}</button></td></tr>`).join('')}</tbody></table></div>${state.demoDraft?`<section class="section" style="margin-top:24px"><div class="section-heading"><h2>编辑草稿</h2><span class="meta">尚未写入目标应用</span></div><div class="settings-row"><div><strong>${escapeHtml(state.demoDraft)}</strong><p>仅本设计演示内保存 · 不写入文件</p></div><button class="button" data-new-connection>继续编辑</button></div></section>`:''}<p class="scope-note">官方登录、叠加连接与外部导入按应用能力呈现；不使用一个全局开关代替安装、配置或写入。</p>`}

function recordsPage(){const values=metricValues(),query=state.query.toLowerCase(),list=requests.filter(r=>(state.recordTab==='sessions'?r.source==='会话导入':true)&&(!query||JSON.stringify(r).toLowerCase().includes(query)));return pageHead('记录与用量','请求、会话和费用保留各自来源与可观测边界',rangeSelect())+`<div class="tabs">${[['requests','请求'],['sessions','会话'],['usage','用量']].map(([id,name])=>`<button class="tab ${state.recordTab===id?'active':''}" data-record-tab="${id}">${name}</button>`).join('')}<span class="aside tiny muted">${state.env==='local'?'本机时区 UTC+08:00':'节点时区 UTC+00:00'}</span></div>`+(state.recordTab==='usage'?`<div class="metric-strip"><div><span class="metric-label">已记录请求与会话</span><span class="metric-value">${values[0]}</span></div><div><span class="metric-label">估算费用 · USD</span><span class="metric-value">$${values[1]}</span></div><div><span class="metric-label">网关平均首 token</span><span class="metric-value">${values[2]}<small>ms</small></span></div></div>${chartHtml()}<p class="scope-note">按来源分别统计；会话没有可靠耗时，不显示为 0。价格缺失的记录不等于免费请求。</p><div class="section-heading" style="margin-top:28px"><h2>来源明细</h2></div><div class="panel"><table class="data-table"><thead><tr><th>来源</th><th>记录数</th><th>平均完整耗时</th><th>估算费用</th></tr></thead><tbody><tr><td>网关请求</td><td>864</td><td>1,428 ms</td><td>$1.42</td></tr><tr><td>会话导入</td><td>420</td><td class="muted">无可靠时序</td><td>$0.76</td></tr></tbody></table></div>`:`<div class="records-summary"><span><strong>${list.length}</strong> 条演示记录</span><span>来源 ${state.recordTab==='sessions'?'仅会话导入':'网关 + 会话导入'}</span><span>选择一行查看详情</span></div><div class="panel"><div class="table-wrap"><table class="data-table request-table"><thead><tr><th>时间</th><th>上游 / 连接</th><th>模型</th><th>完整耗时</th><th>状态</th><th>费用 USD</th></tr></thead><tbody>${list.length?list.map(r=>`<tr class="actionable" data-request="${r.id}" tabindex="0"><td class="mono">${r.time}</td><td>${r.name}<span class="sub">${r.source}</span></td><td><span class="ellipsis">${r.model}</span><span class= function extensionsPage(){const entries=state.extensionTab==='plugins'?[['Codex','内置应用适配器','已安装','结构化配置 · 草稿 · 应用'],['Acme CLI','本地声明式插件','已安装','独立安装，无需修改主程序'],['Claude Code','内置应用适配器','已安装','官方登录 · 连接配置']]:state.extensionTab==='mcp'?[['Filesystem','MCP 服务','已配置','Codex、Claude Code'],['Browser tools','MCP 服务','已配置','Claude Code']]:[['Review changes','技能','已安装','Codex'],['Write tests','技能','已安装','Codex、Claude Code']];return pageHead('扩展','应用适配器、MCP 服务和技能有不同的配置与运行边界',`<button class="button" data-install>${icon('plus',14)}${state.extensionTab==='plugins'?'安装插件':state.extensionTab==='mcp'?'添加服务':'添加技能'}</button>`)+`<div class="tabs">${[['plugins','应用插件'],['mcp','MCP 服务'],['skills','技能']].map(([id,name])=>`<button class="tab ${state.extensionTab===id?'active':''}" data-extension-tab="${id}">${name}</button>`).join('')}</div><div class="panel"><table class="data-table"><thead><tr><th style="width:24%">名称</th><th style="width:25%">类型</th><th style="width:37%">能力 / 作用范围</th><th></th></tr></thead><tbody>${entries.map(e=>`<tr><td><strong style="font-weight:520">${e[0]}</strong><span class="sub">${e[2]}</span></td><td>${e[1]}</td><td>${e[3]}</td><td class="right"><button class="button quiet" data-extension="${e[0]}">详情</button></td></tr>`).join('')}</tbody></table></div><p class="scope-note">${state.extensionTab==='plugins'?'安装适配器提供应用管理能力。是否固定到侧栏、是否写入应用配置，分别在对应位置操作。':'安装或配置不保证目标应用已读取；具体写入结果与重启要求按应用显示。'}</p>`}

function renderDrawer(){let d=state.drawer;if(!d)return;let html='';if(d.kind==='notices'){const list=state.notices.filter(n=>state.noticeFilter==='all'||n.unread);html=drawerFrame('通知','本次启动 · 关闭或已读不代表问题已解决',`<div class="tabs"><button class="tab ${state.noticeFilter==='all'?'active':''}" data-notice-filter="all">全部 <span class="pill-count">${state.notices.length}</span></button><button class="tab ${state.noticeFilter==='unread'?'active':''}" data-notice-filter="unread">未读 <span class="pill-count">${state.notices.filter(n=>n.unread).length}</span></button></div>${list.length?list.map(n=>`<article class="notice-item ${n.unread?'unread':''}" data-tone="${n.tone}"><div class="notice-title"><span class="notice-symbol">${noticeSymbol(n)}</span>${escapeHtml(n.title)}</div><div class="notice-meta"><span>${envLabels[n.env]}</span><span>${n.time}</span><span>演示数据</span></div><p class="notice-summary">${escapeHtml(n.summary)}</p><details class="notice-detail" ${d.focus===n.id?'open':''}><summary>完整说明</summary><pre>${escapeHtml(n.details)}</pre><button class="text-btn" data-copy-notice="${n.id}">${icon('copy',12)} 复制详情</button></details><div class="notice-actions">${n.action==='reconcile'?`<button data-reconcile="${n.id}">核对开发机上的结果 ${icon('arrow',12)}</button>`:n.action==='usage'?`<button data-notice-usage="${n.id}">查看本机用量 ${icon('arrow',12)}</button>`:''}${n.unread?`<button data-read="${n.id}">标为已读</button>`:''}</div></article>`).join(''):'<div class="empty">没有未读通知</div>'}`,`<button class="text-btn" data-read-all>全部标为已读</button>`,false)}else if(d.kind==='route'){const r=routes.find(r=>r.id===d.id);html=drawerFrame(r.name,`${envLabels[state.env]} · ${appNames[r.app]} · 当前配置`,`${pathHtml(r,true)}<div class="detail-list"><div class="detail-pair"><span>写入状态</span><span>${r.written}</span></div><div class="detail-pair"><span>客户端读取</span><span>${r.clients}</span></div><div class="detail-pair"><span>模型映射</span><span class="mono">${r.rule}</span></div><div class="detail-pair"><span>上游选择</span><span>${r.mode==='direct'?'固定目标接口':'按配置允许的协议与模型选择；优先级较低的数值先尝试'}</span></div><div class="detail-pair"><span>观测边界</span><span>${r.mode==='direct'?'没有网关请求轨迹。会话导入不提供可靠请求耗时。':'图中是候选集合，无法从历史日志还原完整重试过程。'}</span></div></div><div class="detail-note">应用能力决定动作。编辑会进入已有的常用 / 高级 / 配置文件工作台，保存草稿不会自动切换连接。</div>`,`<button class="text-btn" data-route-to-connection="${r.app}">在连接页查看 ${icon('arrow',12)}</button>`)}else if(d.kind==='request'){const r=requests.find(r=>r.id===d.id);html=drawerFrame('请求记录',`${envLabels[state.env]} · ${r.time} · ${r.source}`,`<span class="badge ${r.code>=400?'bad':r.code?'good':''}">${r.code?'HTTP '+r.code:'会话导入'}</span><div class="detail-list"><div class="detail-pair"><span>记录 ID</span><span class="mono">${r.id}</span></div><div class="detail-pair"><span>已记录上游</span><span>${r.name}</span></div><div class="detail-pair"><span>请求模型</span><span>${r.request}</span></div><div class="detail-pair"><span>响应模型</span><span>${r.model}</span></div><div class="detail-pair"><span>完整耗时</span><span>${r.ms?r.ms+' ms':'未记录；会话没有可靠时序'}</span></div><div class="detail-pair"><span>首 token</span><span>${r.first?r.first+' ms':'未记录'}</span></div><div class="detail-pair"><span>输入 / 输出</span><span>${r.tokens}</span></div><div class="detail-pair"><span>估算费用</span><span>${r.cost?'$'+r.cost+' USD':'未计价'}</span></div></div>${r.code>=400?'<div class="detail-note">上游返回 502。此记录不能证明当前端点仍然失败，也不能证明备用接口已被尝试。</div>':'<div class="detail-note">这些字段来自记录本身。当前路由配置不会被补画成这次请求的历史轨迹。</div>'}`)}else if(d.kind==='new'){html=drawerFrame('添加连接',`${envLabels[state.env]} · 编辑演示`, `<label class="form-field"><span>连接名称</span><input id="draft-name" value="${escapeHtml(state.demoDraft||'')}" placeholder="例如：团队备用 API"><small>演示只在当前页面内保留，不写入配置或磁盘。</small></label><label class="form-field"><span>目标应用</span><select><option>Codex</option><option>Claude Code</option><option>OpenCode</option></select></label><div class="detail-note">完整编辑沿用三层工作台：常用、高级、配置文件。字段来自应用适配器，不用一套固定表单假装支持所有应用。</div>`,`<button class="button primary" data-save-demo>保存演示草稿</button>`)}else if(d.kind==='endpoint'){html=drawerFrame(d.name,`${envLabels[state.env]} · 上游接口`, `<div class="detail-list"><div class="detail-pair"><span>协议</span><span>Responses</span></div><div class="detail-pair"><span>最近可达性</span><span>${d.name==='North API'?'端点可达':'未探测'}</span></div><div class="detail-pair"><span>时间</span><span>现有数据未提供采样时间</span></div><div class="detail-pair"><span>凭据</span><span>不在看板、通知或详情中显示</span></div></div><div class="detail-note">可达性不等于授权成功或模型可用；上游的请求统计需要独立读取。</div>`)}else if(d.kind==='extension'){html=drawerFrame(d.name,'扩展详情',`<div class="detail-list"><div class="detail-pair"><span>范围</span><span>${envLabels[state.env]}</span></div><div class="detail-pair"><span>状态</span><span>已安装 / 已配置</span></div><div class="detail-pair"><span>管理入口</span><span>按能力显示结构化编辑、目标应用和使用说明。</span></div></div><div class="detail-note">安装插件、固定应用入口、写入配置是不同动作。这里不放一个含义模糊的总开关。</div>`)}else if(d.kind==='toastDemo'){html=drawerFrame('演示通知','所有操作只作用于设计稿',`<div class="toast-demo-menu"><button data-demo-notice="success">${icon('checkCircle')}　简短成功 · 配置已写入</button><button data-demo-notice="error">${icon('error')}　长错误 · 详情折叠进通知中心</button><button data-demo-notice="pending">${icon('warning')}　远端结果未知 · 只提供核对</button></div><div class="detail-note">浮层位于全局工具栏下方，不遮挡编辑器底部保存栏。悬停或键盘聚焦会暂停消失。每条都能从通知中心重新找到。</div>`)}else{html=drawerFrame(d.title,'设计说明',`<p class="page-description">${escapeHtml(d.text)}</p>`)}$('overlay').innerHTML=html;bindDrawer();if(d.kind==='route'){const path=$('overlay').querySelector('.path-flow');path.style.gridTemplateColumns='1fr';$('overlay').querySelectorAll('.path-link').forEach(n=>{n.style.width='1px';n.style.height='12px';n.style.marginLeft='18px'});$('overlay').querySelectorAll('.path-heading .tiny').forEach(n=>n.style.display='none');$('overlay').querySelector('.route-path').style.border='1px solid var(--line)';$('overlay').querySelector('.route-path').style.borderRadius='6px'}}
function bindDrawer(){const scope=$('overlay');scope.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeDrawer());scope.querySelectorAll('[data-notice-filter]').forEach(b=>b.onclick=()=>{state.noticeFilter=b.dataset.noticeFilter;renderDrawer()});scope.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{state.notices.find(n=>n.id===b.dataset.read).unread=false;renderNav();renderDrawer()});scope.querySelectorAll('[data-read-all]').forEach(b=>b.onclick=()=>{state.notices.forEach(n=>n.unread=false);renderNav();renderDrawer()});scope.querySelectorAll('[data-copy-notice]').forEach(b=>b.onclick=async()=>{const note=state.notices.find(n=>n.id===b.dataset.copyNotice);try{await navigator.clipboard.writeText(note.details);b.textContent='已复制'}catch{b.textContent='请选择说明中的文字复制'}});scope.querySelectorAll('[data-reconcile]').forEach(b=>b.onclick=()=>{const n=state.notices.find(n=>n.id===b.dataset.reconcile);b.textContent='核对同一演示请求…';b.disabled=true;setTimeout(()=>{n.title='开发机上的结果已核对';n.summary='原草稿版本已写入；新的编辑内容不会覆盖。';n.details+='\n演示核对结果：已写入原草稿版本 4，客户端读取未确认。';n.tone='success';n.action=null;n.unread=true;renderNav();renderDrawer();showToast(n)},650)});scope.querySelectorAll('[data-notice-usage]').forEach(b=>b.onclick=()=>{state.env='local';$('environment').value='local';state.recordTab='usage';nav('records')});scope.querySelectorAll('[data-route-to-connection]').forEach(b=>b.onclick=()=>{state.app=b.dataset.routeToConnection;nav('connections')});scope.querySelectorAll('[data-save-demo]').forEach(b=>b.onclick=()=>{const name=$('draft-name').value.trim();if(!name){$('draft-name').focus();$('draft-name').setAttribute('aria-invalid','true');$('draft-name').placeholder='请填写连接名称';return}state.demoDraft=name;closeDrawer();nav('connections');showNotice({id:'demo-draft',title:'草稿已保存',summary:'仅保留在本设计演示；没有写入目标应用。',details:'名称：'+name+'\n这是虚构演示数据。关闭页面后不保留。',tone:'success',env:state.env})});scope.querySelectorAll('[data-demo-notice]').forEach(b=>b.onclick=()=>{const kind=b.dataset.demoNotice;closeDrawer();if(kind==='success')showNotice({id:'demo-apply',title:'配置已写入',summary:'Codex · 团队编码；客户端读取尚未确认。',details:'写入完成的演示。\n环境：'+envLabels[state.env]+'\n原生应用配置未实际改变。\n完整回执可撤回的场景才提供撤回动作；本演示没有真实回执。',tone:'success',env:state.env});else if(kind==='error')showNotice({id:'demo-error',title:'无法读取远端配置',summary:'连接中断，已有输入仍保留。',details:'操作：读取开发机配置\n节点：demo-ubuntu\n类别：SSH 连接中断\nconnection closed while awaiting remote response; channel EOF\n原始说明保留在这里，浮层只显示短摘要。\n请检查节点连接；不要把读取失败解释成空配置。\n此演示不含真实凭据或网络地址。',tone:'error',env:'dev'});else showNotice({...state.notices.find(n=>n.id==='apply-dev'),title:'开发机的应用结果待核对',summary:'操作可能已完成，请核对同一次提交。',tone:'warning',action:'reconcile'})})}
function showNotice(notice){notice={...notice,time:'现在',unread:true};const index=state.notices.findIndex(n=>n.id===notice.id);if(index>=0)state.notices.splice(index,1);state.notices.unshift(notice);state.notices=state.notices.slice(0,64);renderNav();showToast(notice)}
function showToast(notice){state.toast=notice;renderToast();scheduleToast()}
function scheduleToast(){clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;renderToast()},6500)}
function renderToast(){if(!state.toast){$('toast-area').innerHTML='';return}const n=state.toast;$('toast-area').innerHTML=`<div class="toast ${n.tone}" role="status"><span class="notice-symbol">${noticeSymbol(n)}</span><div><p class="toast-title">${escapeHtml(n.title)}</p><p class="toast-summary">${escapeHtml(n.summary)}</p></div><div class="toast-actions"><button class="text-btn" id="toast-details">详情</button><button class="icon-btn" id="toast-close" aria-label="关闭通知">${icon('close',13)}</button></div></div>`;$('toast-details').onclick=()=>{const id=state.toast.id;state.toast=null;renderToast();openDrawer({kind:'notices',focus:id})};$('toast-close').onclick=()=>{state.toast=null;renderToast()};const toast=$('toast-area').firstElementChild;toast.onmouseenter=()=>clearTimeout(toastTimer);toast.onmouseleave=()=>{if(!toast.contains(document.activeElement))scheduleToast()};toast.onfocusin=()=>clearTimeout(toastTimer);toast.onfocusout=e=>{if(!toast.contains(e.relatedTarget))scheduleToast()}}
$('search-icon').innerHTML=icon('search',16);$('environment').onchange=e=>{state.env=e.target.value;closeDrawer(false);render()};$('theme-toggle').onclick=()=>setTheme(state.theme==='light'?'dark':'light');$('notifications-button').onclick=()=>state.drawer?.kind==='notices'?closeDrawer():openDrawer({kind:'notices'});$('global-search').oninput=e=>{state.query=e.target.value;if(!['overview','connections','routes','records'].includes(state.page))state.page='connections';render()};$('demo-trigger').onclick=()=>openDrawer({kind:'toastDemo'});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{$('shell').dataset.viewport=b.dataset.width;document.querySelectorAll('[data-width]').forEach(c=>c.classList.toggle('active',c===b))});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.drawer)closeDrawer();else if(state.toast){state.toast=null;renderToast()}}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('global-search').focus()}if(e.key==='Tab'&&state.drawer){const focusable=[...$('overlay').querySelectorAll('button:not(:disabled),input,select,summary,a[href]')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script>
